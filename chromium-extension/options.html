<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>IDM No Ads — Options</title>
    <style>
      body { font-family: "Segoe UI", system-ui, sans-serif; background: #0f1420; color: #e6ebf5;
        margin: 0; padding: 24px; }
      .wrap { max-width: 640px; margin: 0 auto; }
      h1 { font-size: 20px; display: flex; align-items: center; gap: 10px; }
      h1 img { width: 28px; height: 28px; border-radius: 6px; }
      h2 { font-size: 14px; color: #93a0bd; text-transform: uppercase; letter-spacing: .5px;
        margin-top: 26px; }
      .card { background: #1b2233; border: 1px solid #2a3550; border-radius: 12px; padding: 16px; }
      label.row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
      input[type="text"], input[type="number"] { background: #0f1420; border: 1px solid #2a3550;
        color: #e6ebf5; border-radius: 8px; padding: 8px 10px; width: 100%; }
      .types { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
      .chip { padding: 5px 11px; border-radius: 99px; border: 1px solid #2a3550; background: #0f1420;
        color: #93a0bd; cursor: pointer; font-size: 12px; user-select: none; }
      .chip.on { background: #2563eb; color: #fff; border-color: #2563eb; }
      .save { margin-top: 20px; background: #2563eb; color: #fff; border: none; border-radius: 9px;
        padding: 10px 18px; font-weight: 600; cursor: pointer; }
      .save:hover { background: #1d4ed8; }
      .hint { color: #93a0bd; font-size: 12px; margin-top: 4px; }
      #saved { color: #22c55e; margin-left: 12px; font-size: 13px; opacity: 0; transition: opacity .2s; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1><img src="icons/icon-48.png" /> IDM No Ads — Options</h1>

      <h2>Interception</h2>
      <div class="card">
        <label class="row"><input type="checkbox" id="enabled" /> Capture downloads automatically</label>
        <label class="row">Minimum file size to capture (MB, 0 = all):
          <input type="number" id="minSize" min="0" style="width:90px" /></label>
      </div>

      <h2>Capture these file types</h2>
      <div class="card"><div class="types" id="types"></div></div>

      <h2>Download engine (aria2 RPC)</h2>
      <div class="card">
        <label class="row">Port: <input type="number" id="rpcPort" style="width:110px" /></label>
        <label class="row" style="flex-direction:column; align-items:stretch;">
          <span>Secret <small style="color:#22c55e">(auto-detected)</small></span>
          <input type="text" id="rpcSecret" placeholder="filled in automatically when the desktop app is running" />
        </label>
        <div class="hint">✓ These are detected <b>automatically</b> from the desktop app over the
          native-messaging connection — you don't need to copy or paste anything. They're shown
          here only for troubleshooting.</div>
      </div>

      <button class="save" id="save">Save</button><span id="saved">✓ Saved</span>
    </div>
    <script src="options.js"></script>
  </body>
</html>
