name: Build IDM No Ads

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  ARIA2_VERSION: "1.37.0"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            native-host

      - name: Download aria2 sidecar (segmented download engine)
        shell: pwsh
        run: |
          $ver = "${{ env.ARIA2_VERSION }}"
          $url = "https://github.com/aria2/aria2/releases/download/release-$ver/aria2-$ver-win-64bit-build1.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile aria2.zip
          Expand-Archive aria2.zip -DestinationPath aria2tmp -Force
          $exe = Get-ChildItem -Recurse aria2tmp -Filter aria2c.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item $exe.FullName "src-tauri/binaries/aria2c-x86_64-pc-windows-msvc.exe" -Force

      - name: Build native messaging host
        run: cargo build --release --manifest-path native-host/Cargo.toml

      - name: Stage native host as Tauri sidecar
        shell: pwsh
        run: Copy-Item native-host/target/release/idmnoads-host.exe "src-tauri/binaries/idmnoads-host-x86_64-pc-windows-msvc.exe" -Force

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Create self-signed certificate for MSIX signing
        shell: pwsh
        run: |
          # MSIX packages must be signed to install. For CI/sideloading we use a
          # self-signed cert. Partner Center re-signs with the Microsoft certificate
          # on upload, so this signature is only needed for local testing.
          $cert = New-SelfSignedCertificate `
            -Subject "CN=IDMNoAdsTest, O=IDMNoAds, C=ID" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -Type CodeSigningCert `
            -KeyUsage DigitalSignature `
            -FriendlyName "IDMNoAds CI Test Signing"
          $pwd = ConvertTo-SecureString -String "idmnoads" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath msix-sign.pfx -Password $pwd
          Write-Host "MSIX_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build Tauri app (MSI + NSIS setup.exe)
        run: tauri build

      - name: Package MSIX (makeappx + self-signed signtool)
        shell: pwsh
        run: |
          # ── 1. Locate built binaries ──────────────────────────────────────────
          $releaseDir = "src-tauri\target\release"
          $mainExe    = Join-Path $releaseDir "IDM No Ads.exe"
          $aria2Exe   = Join-Path $releaseDir "aria2c.exe"
          $hostExe    = Join-Path $releaseDir "idmnoads-host.exe"

          if (-not (Test-Path $mainExe)) {
            Write-Warning "Main executable not found at $mainExe — skipping MSIX"
            exit 0
          }

          # ── 2. Build MSIX staging directory ───────────────────────────────────
          $stage = "msix-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage\icons" | Out-Null

          # Binaries
          Copy-Item $mainExe    "$stage\IDM No Ads.exe" -Force
          if (Test-Path $aria2Exe) { Copy-Item $aria2Exe  "$stage\aria2c.exe" -Force }
          if (Test-Path $hostExe)  { Copy-Item $hostExe   "$stage\idmnoads-host.exe" -Force }

          # WebView2 loader (present after tauri build)
          $wv2 = Get-ChildItem -Recurse $releaseDir -Filter WebView2Loader.dll |
                 Select-Object -First 1
          if ($wv2) { Copy-Item $wv2.FullName "$stage\WebView2Loader.dll" -Force }

          # Icons required by the manifest
          foreach ($icon in @(
            "Square30x30Logo.png","Square44x44Logo.png","Square71x71Logo.png",
            "Square89x89Logo.png","Square107x107Logo.png","Square142x142Logo.png",
            "Square150x150Logo.png","Square284x284Logo.png","Square310x310Logo.png",
            "StoreLogo.png","icon.png"
          )) {
            $src = "src-tauri\icons\$icon"
            if (Test-Path $src) { Copy-Item $src "$stage\icons\$icon" -Force }
          }

          # ── 3. Write AppxManifest.xml (substitute {{VERSION}}) ───────────────
          $version = "1.0.0"
          (Get-Content "src-tauri\AppxManifest.xml.template" -Raw) `
            -replace '\{\{VERSION\}\}', $version |
            Set-Content "$stage\AppxManifest.xml" -Encoding UTF8

          # ── 4. Run makeappx to create the MSIX ───────────────────────────────
          $makeappx = Get-ChildItem -Recurse "C:\Program Files (x86)\Windows Kits\10\bin" `
                        -Filter makeappx.exe | Select-Object -Last 1
          if (-not $makeappx) {
            Write-Warning "makeappx.exe not found — MSIX packaging skipped"
            exit 0
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $makeappx.FullName pack /d $stage /p dist\IDMNoAds.msix /nv /o
          Write-Host "MSIX created: dist\IDMNoAds.msix"

          # ── 5. Sign with the self-signed cert created earlier ─────────────────
          $signtool = Get-ChildItem -Recurse "C:\Program Files (x86)\Windows Kits\10\bin" `
                        -Filter signtool.exe | Select-Object -Last 1
          if ($signtool -and (Test-Path msix-sign.pfx)) {
            & $signtool.FullName sign /fd SHA256 /f msix-sign.pfx /p idmnoads `
                /tr http://timestamp.digicert.com /td SHA256 dist\IDMNoAds.msix
            Write-Host "MSIX signed."
          }

      - name: Stage release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # Installers
          $setup = Get-ChildItem -Recurse src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          $msi   = Get-ChildItem -Recurse src-tauri/target/release/bundle/msi  -Filter *.msi | Select-Object -First 1
          $msix  = Get-ChildItem -Recurse src-tauri/target/release/bundle/app  -Filter *.msix | Select-Object -First 1
          if ($setup) { Copy-Item $setup.FullName "dist/IDMNoAds-setup.exe" -Force }
          if ($msi)   { Copy-Item $msi.FullName   "dist/IDMNoAds.msi" -Force }
          if ($msix)  { Copy-Item $msix.FullName  "dist/IDMNoAds.msix" -Force }

          # Chromium extension zip (manifest at root; NEVER ship key.pem).
          # The Chrome Web Store REJECTS the "key" field, so strip it from the
          # published manifest. (The repo keeps "key" for local unpacked dev so
          # the dev extension ID matches the native-host allowed_origins.)
          $cs = "ext-stage/chromium"
          New-Item -ItemType Directory -Force -Path $cs | Out-Null
          Copy-Item chromium-extension/background.js,chromium-extension/content.js,chromium-extension/popup.html,chromium-extension/popup.js,chromium-extension/options.html,chromium-extension/options.js $cs -Force
          Copy-Item chromium-extension/icons $cs/icons -Recurse -Force
          # Use Node for a faithful JSON round-trip (preserves single-element arrays).
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('chromium-extension/manifest.json','utf8'));delete m.key;fs.writeFileSync('$cs/manifest.json',JSON.stringify(m,null,2))"
          Compress-Archive -Path "$cs/*" -DestinationPath "dist/IDMNoAds-chrome-extension.zip" -Force

          # Firefox extension zip
          $fs = "ext-stage/firefox"
          New-Item -ItemType Directory -Force -Path $fs | Out-Null
          Copy-Item firefox-extension/manifest.json,firefox-extension/background.js,firefox-extension/content.js,firefox-extension/popup.html,firefox-extension/popup.js,firefox-extension/options.html,firefox-extension/options.js $fs -Force
          Copy-Item firefox-extension/icons $fs/icons -Recurse -Force
          Compress-Archive -Path "$fs/*" -DestinationPath "dist/IDMNoAds-firefox-extension.zip" -Force

          Get-ChildItem dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IDMNoAds-windows
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/claude/new-session-FN7z3'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: IDM No Ads v1.0.0
          prerelease: false
          make_latest: true
          body: |
            **IDM No Ads** — free, no-ads, segmented download manager for Windows.

            ### Downloads
            | File | Purpose |
            | ---- | ------- |
            | `IDMNoAds-setup.exe` | Recommended installer (NSIS, per-user, registers browser integration) |
            | `IDMNoAds.msi` | MSI installer (basic install) |
            | `IDMNoAds.msix` | MSIX package — for Microsoft Store sideloading / upload to Partner Center |
            | `IDMNoAds-chrome-extension.zip` | Upload to Chrome Web Store / Edge Add-ons / Opera (no `key` field) |
            | `IDMNoAds-firefox-extension.zip` | Upload to Firefox AMO |

            > ⚠️ The NSIS/MSI installers are **unsigned**, so Windows SmartScreen shows an
            > "Unknown publisher" warning. Click **More info → Run anyway**.
            > The MSIX is self-signed (CI certificate); to install it locally, right-click
            > → Properties → Digital Signatures → install the cert to Trusted Publishers first,
            > or install via `Add-AppxPackage`. The Store version is signed by Microsoft.

            Created by **Ir. Riovan Styx Roring**.
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
