[package]
name = "idmnoads-host"
version = "1.0.0"
description = "IDM No Ads native messaging host — bridges browser extensions to the desktop app"
authors = ["Ir. Riovan Styx Roring"]
edition = "2021"

[[bin]]
name = "idmnoads-host"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
